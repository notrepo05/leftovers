groups:
- name: leftovers
  jobs:
  - unit
  - acceptance-aws
  - acceptance-azure
  - acceptance-gcp
  - acceptance-vsphere
  - acceptance-nimbus
  - acceptance-openstack
  - releasable
  - build-release

resources:
- name: leftovers
  type: git
  source:
    branch: feature/regex-matching
    uri: https://github.com/notrepo05/leftovers.git

- name: release
  type: github-release
  source:
    owner: notrepo05
    repository: leftovers
    access_token: ((leftovers.github_access_token))
    release: false
    pre_release: true

jobs:
- name: unit
  serial: true
  plan:
  - get: leftovers
    trigger: true
  - task: unit
    file: leftovers/ci/tasks/unit/task.yml

- name: acceptance-gcp
  serial: true
  plan:
  - get: leftovers
    trigger: true
    passed: [unit]
  - task: acceptance
    file: leftovers/ci/tasks/acceptance/task.yml
    params:
      LEFTOVERS_ACCEPTANCE: gcp
      BBL_GCP_SERVICE_ACCOUNT_KEY: ((leftovers.gcp_service_account_key))

- name: acceptance-aws
  serial: true
  plan:
  - get: leftovers
    trigger: true
    passed: [unit]
  - task: acceptance
    file: leftovers/ci/tasks/acceptance/task.yml
    params:
      LEFTOVERS_ACCEPTANCE: aws
      BBL_AWS_ACCESS_KEY_ID: ((leftovers.aws_access_key_id))
      BBL_AWS_SECRET_ACCESS_KEY: ((leftovers.aws_secret_access_key))
      BBL_AWS_REGION: ((leftovers.aws_region))

- name: acceptance-azure
  serial: true
  plan:
  - get: leftovers
    trigger: true
    passed: [unit]
  - task: acceptance
    file: leftovers/ci/tasks/acceptance/task.yml
    params:
      LEFTOVERS_ACCEPTANCE: azure
      BBL_AZURE_SUBSCRIPTION_ID: ((leftovers.azure_subscription_id))
      BBL_AZURE_TENANT_ID: ((leftovers.azure_tenant_id))
      BBL_AZURE_CLIENT_ID: ((leftovers.azure_client_id))
      BBL_AZURE_CLIENT_SECRET: ((leftovers.azure_client_secret))

- name: acceptance-vsphere
  serial: true
  plan:
  - get: leftovers
    trigger: true
    passed: [unit]
  - task: acceptance
    file: leftovers/ci/tasks/acceptance/task.yml
    tags:
    - ((leftovers.vsphere_tag))
    params:
      LEFTOVERS_ACCEPTANCE: vsphere
      BBL_VSPHERE_VCENTER_IP: ((leftovers.vsphere_vcenter_ip))
      BBL_VSPHERE_VCENTER_USER: ((leftovers.vsphere_vcenter_user))
      BBL_VSPHERE_VCENTER_PASSWORD: ((leftovers.vsphere_vcenter_password))
      BBL_VSPHERE_VCENTER_DC: ((leftovers.vsphere_vcenter_dc))
      BBL_VSPHERE_VCENTER_DS: ((leftovers.vsphere_vcenter_ds))
      BBL_VSPHERE_VCENTER_RP: ((leftovers.vsphere_vcenter_rp))
      LEFTOVERS_VSPHERE_FILTER: ((leftovers.vsphere_vcenter_disks))

- name: acceptance-nimbus
  serial: true
  plan:
  - get: leftovers
    trigger: true
    passed: [unit]
  - task: acceptance
    file: leftovers/ci/tasks/acceptance/task.yml
    params:
      LEFTOVERS_ACCEPTANCE: nimbus
      LEFTOVERS_NIMBUS_RESULTS_DIR: ((leftovers.nimbus_results_dir))
      BBL_NIMBUS_USER: ((leftovers.nimbus_user))

- name: acceptance-openstack
  serial: true
  plan:
  - get: leftovers
    trigger: true
    passed: [unit]
  - task: acceptance
    file: leftovers/ci/tasks/acceptance/task.yml
    params:
      LEFTOVERS_ACCEPTANCE: openstack
      BBL_OPENSTACK_AUTH_URL: ((leftovers.openstack_auth_url))
      BBL_OPENSTACK_PASSWORD: ((leftovers.openstack_password))
      BBL_OPENSTACK_USERNAME: ((leftovers.openstack_username))
      BBL_OPENSTACK_PROJECT: ((leftovers.openstack_project))
      BBL_OPENSTACK_DOMAIN: ((leftovers.openstack_domain))
      BBL_OPENSTACK_REGION: ((leftovers.openstack_region))
    tags:
    - ((leftovers.openstack_tag))

- name: releasable
  plan:
  - get: leftovers
    trigger: true
    passed:
    # - acceptance-gcp
    - acceptance-aws
    - acceptance-azure
    - acceptance-nimbus
    # - acceptance-vsphere
    # - acceptance-openstack

- name: build-release
  plan:
  - in_parallel:
    - get: release
    - get: leftovers
      passed: [releasable]
  - task: build-release-with-minor-bump
    file: leftovers/ci/tasks/build-release/task.yml
  - put: release
    params:
      name: builds/name
      tag: builds/name
      commitish: builds/commitish
      globs:
      - builds/bin/leftovers-*